name: E01 - Testes da regra de pressao

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  teste-pressao:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar pytest
        run: python -m pip install 'pytest>=8,<10'
      - name: Executar nove cenarios E01
        run: |
          mkdir -p relatorios
          python -m pytest tests/test_estabilidade_pressao.py -v --junitxml=relatorios/testes_pressao.xml
      - name: Salvar relatorio JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e01-pytest-relatorio
          path: relatorios/testes_pressao.xml
          if-no-files-found: warn
          retention-days: 30
