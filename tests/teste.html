<!-- teste.html -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>CIPP Telemetry - Teste WS</title>
    <!-- CSS provisório só pra quebrar um galho no monitor de teste -->
    <style>
        body { font-family: 'Courier New', Courier, monospace; background: #121212; color: #00ff00; padding: 20px; }
        .alerta { color: #ff3333; font-weight: bold; }
        .info { color: #aaaaaa; }
    </style>
</head>
<body>
    <h2>📡 Monitor de Telemetria CIPP (Ambiente de Teste)</h2>
    <div id="terminal"></div>

    <script>
        // Aponta pro socket do FastAPI
        const ws = new WebSocket("ws://localhost:8000/ws/simulador");
        const terminal = document.getElementById("terminal");

        ws.onmessage = function(event) {
            const dados = JSON.parse(event.data);
            const linha = document.createElement("p");
            
            // Trata o encerramento do stream
            if (dados.status === "finalizado") {
                linha.innerText = "🛑 " + dados.mensagem;
                linha.style.color = "yellow";
            } else {
                // Log normal da telemetria
                linha.innerText = `[Min ${dados.minuto}] Vel. Real: ${dados.velocidade_cm_min} cm/min | Limite: ${dados.limite_teorico} cm/min | Desvio: ${dados.desvio_cm_min}`;
                
                // Se a API flagrou erro estrutural na cura, renderiza o alerta
                if (dados.alerta) {
                    linha.classList.add("alerta");
                    linha.innerText += " ⚠️ ALERTA DE RISCO ESTRUTURAL!";
                }
            }
            terminal.appendChild(linha);
        };

        ws.onopen = () => terminal.innerHTML += "<p class='info'>Conectado ao backend. Aguardando dados...</p>";
        ws.onclose = () => terminal.innerHTML += "<p class='info'>Conexão encerrada pelo servidor.</p>";
    </script>
</body>
</html>
